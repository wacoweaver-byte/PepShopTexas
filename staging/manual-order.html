<!doctype html><html lang="en" data-auth-guard="admin"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Manual Order | Pep Shop Texas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="auth-guard.js?v=1"></script><style>
:root{font-family:Arial,sans-serif;color:#172238}*{box-sizing:border-box}body{margin:0;background:#f5f7fb}header{background:#fff;border-bottom:2px solid #111;padding:16px 4%;display:flex;align-items:center;gap:32px;flex-wrap:wrap}header img{width:180px;max-height:72px;object-fit:contain}nav{display:flex;flex-wrap:wrap;gap:18px}a{color:#153e75}main{max-width:1060px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #d5dbe4;padding:22px;margin:16px 0}h1{font-size:26px}h2{font-size:18px;margin-top:0}label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #9da8b8;padding:10px;font:inherit;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}button{border:0;background:#123a71;color:white;padding:11px 18px;font-weight:bold;cursor:pointer;border-radius:4px}button.secondary{background:#e9edf3;color:#172238}button:disabled{opacity:.5}.line{display:grid;grid-template-columns:minmax(240px,1fr) 90px 100px 40px;gap:10px;align-items:end;margin-bottom:12px}.price{padding:12px 0;text-align:right}.total{text-align:right;font-size:23px;font-weight:bold;margin-top:20px}.notice{font-size:13px;color:#5b6779}#status{padding:12px 0;font-weight:bold}@media(max-width:640px){.line{grid-template-columns:1fr 75px;}.line .price{display:none}}
</style><meta name="robots" content="noindex,nofollow"><script src="staging-banner.js" defer></script></head><body><header><a href="admin.html"><img src="pst-header-logo.png" alt="Pep Shop Texas"></a><nav><a href="admin.html">Orders</a><a href="customers.html">Customers</a><a href="inventory.html">Inventory</a><a href="products.html">Products</a></nav></header>
<main><h1>Create Manual Order</h1><p class="notice">Creates a pending order using current catalog prices. Inventory follows your existing order processing workflow; this screen does not deduct stock.</p>
<section class="panel"><h2>Customer</h2><label for="customerSearch">Find customer by name, customer number, or email</label><input id="customerSearch" placeholder="Search customers" autocomplete="off"><br><br><select id="customerSelect"><option value="">Select customer</option></select><p class="notice" id="customerInfo"></p></section>
<section class="panel"><h2>Products</h2><div id="lines"></div><button type="button" id="addLine" class="secondary">+ Add Product</button></section>
<section class="panel"><div class="grid"><div><label for="shipping">Shipping Charge ($)</label><input id="shipping" type="number" min="0" step=".01" value="0"></div><div><label for="notes">Admin Notes</label><textarea id="notes" rows="2"></textarea></div></div><div class="total" id="total">Total: $0.00</div><div id="status"></div><button id="save">Save Pending Order</button> <a href="admin.html">Cancel</a></section></main>
<script>
const url="https://ndpfnerhvawbavkotinh.supabase.co",key="sb_publishable_7d5fHwVYUeD1SuxZuM-Qbw_nql4agIH",db=supabase.createClient(url,key);let customers=[],products=[];
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderCustomers(){const q=$("customerSearch").value.trim().toLowerCase();const current=$("customerSelect").value;$("customerSelect").innerHTML='<option value="">Select customer</option>'+customers.filter(c=>[c.name,c.email,c.number].join(" ").toLowerCase().includes(q)).map(c=>'<option value="'+esc(c.source+":"+c.id)+'">'+esc(c.number+" — "+c.name+" ("+(c.email||"no email")+")")+'</option>').join("");if([...$("customerSelect").options].some(o=>o.value===current))$("customerSelect").value=current;updateCustomer()}
function updateCustomer(){const c=customers.find(c=>c.source+":"+c.id===$("customerSelect").value);$("customerInfo").textContent=c?"Shipping: "+[c.address,c.city,c.state,c.zip].filter(Boolean).join(", "):""}
function options(){return '<option value="">Select product and strength</option>'+products.map(p=>'<option value="'+esc(p.product_key)+'">'+esc(p.display_name+" — "+(p.strength||"")+" — "+money(p.price))+'</option>').join("")}
function addLine(){const row=document.createElement("div");row.className="line";row.innerHTML='<div><label>Product / Strength</label><select class="product">'+options()+'</select></div><div><label>Qty</label><input class="qty" type="number" value="1" min="1" max="500"></div><div class="price">$0.00</div><button type="button" class="secondary remove" aria-label="Remove line">×</button>';$("lines").append(row);row.querySelectorAll("select,input").forEach(e=>e.addEventListener("change",totals));row.querySelector(".remove").onclick=()=>{row.remove();totals()};totals()}
function totals(){let subtotal=0;document.querySelectorAll(".line").forEach(row=>{const p=products.find(p=>p.product_key===row.querySelector(".product").value),qty=Number(row.querySelector(".qty").value);const amount=p&&Number.isInteger(qty)&&qty>0?p.price*qty:0;row.querySelector(".price").textContent=money(amount);subtotal+=amount});$("total").textContent="Total: "+money(subtotal+Math.max(0,Number($("shipping").value)||0))}
async function save(){const c=customers.find(c=>c.source+":"+c.id===$("customerSelect").value);if(!c){$("status").textContent="Select a customer.";return}const lines=[...document.querySelectorAll(".line")].map(r=>({product_key:r.querySelector(".product").value,quantity:Number(r.querySelector(".qty").value)}));if(!lines.length||lines.some(x=>!x.product_key||!Number.isInteger(x.quantity)||x.quantity<1||x.quantity>500)){$("status").textContent="Select products and valid quantities.";return}const shipping=Number($("shipping").value);if(!Number.isFinite(shipping)||shipping<0){$("status").textContent="Enter valid shipping.";return}$("save").disabled=true;$("status").textContent="Saving order...";try{const {data,error}=await db.rpc("admin_create_manual_order",{p_customer_source:c.source,p_customer_uuid:c.id,p_lines:lines,p_shipping:shipping,p_notes:$("notes").value});if(error)throw error;$("status").textContent="Created "+data.order_number+" — "+money(data.total)+". Returning to Orders...";setTimeout(()=>location.href="admin.html",1300)}catch(e){$("status").textContent="Could not save: "+e.message;$("save").disabled=false}}
async function init(){try{const {data:{session}}=await db.auth.getSession();if(!session)throw Error("Sign in as administrator.");const {data:admin,error:aerror}=await db.from("admin_users").select("user_id").eq("user_id",session.user.id).eq("is_active",true).maybeSingle();if(aerror||!admin)throw Error("Administrator access required.");const [o,m,p]=await Promise.all([db.from("customer_profiles").select("user_id,customer_number,first_name,last_name,email,shipping_address,shipping_city,shipping_state,shipping_zip"),db.from("manual_customers").select("id,customer_number,first_name,last_name,email,shipping_address,shipping_city,shipping_state,shipping_zip"),db.from("product_catalog").select("product_key,display_name,strength,price,is_active").eq("is_active",true).order("display_name")]);for(const x of [o,m,p])if(x.error)throw x.error;customers=[...(o.data||[]).map(c=>({...c,source:"online",id:c.user_id})),...(m.data||[]).map(c=>({...c,source:"manual"}))].map(c=>({...c,name:[c.first_name,c.last_name].filter(Boolean).join(" "),number:"PST-C"+c.customer_number,address:c.shipping_address,city:c.shipping_city,state:c.shipping_state,zip:c.shipping_zip}));products=(p.data||[]).filter(x=>x.product_key).map(x=>({...x,price:Number(x.price||0)}));renderCustomers();addLine();const params=new URLSearchParams(location.search),source=params.get("source"),id=params.get("customer");if(source&&id){$("customerSelect").value=source+":"+id;updateCustomer()} }catch(e){$("status").textContent=e.message;$("save").disabled=true}}
$("customerSearch").addEventListener("input",renderCustomers);$("customerSelect").addEventListener("change",updateCustomer);$("addLine").addEventListener("click",addLine);$("shipping").addEventListener("input",totals);$("save").addEventListener("click",save);init();
</script></body></html>
