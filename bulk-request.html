<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Research Request | Pep Shop Texas</title>
<link rel="icon" href="favicon.ico"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#102a43;font:16px/1.5 Arial,Helvetica,sans-serif}header{background:#101820;color:white;padding:18px 22px}header a{color:white;text-decoration:none;font-weight:bold}main{max-width:900px;margin:40px auto 65px;padding:0 20px}.card{background:white;border:1px solid #dbe2e8;border-radius:14px;padding:32px;box-shadow:0 8px 22px #172a3810}h1{font-size:32px;margin:0 0 10px}p{margin:0 0 23px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:grid;gap:7px}.wide{grid-column:1/-1}label{font-weight:600}input,textarea,select{font:inherit;padding:12px;width:100%;border-radius:7px;border:1px solid #bfccd7;color:#102a43;background:#fff}textarea{min-height:90px;resize:vertical}.check{display:flex;align-items:start;gap:12px}.check input{width:auto;margin-top:6px}.check label{font-weight:normal}button{background:#102a43;color:#fff;padding:13px 25px;border:0;border-radius:6px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.hint{color:#576879;font-size:14px}.notice{margin-top:15px}a{color:#102a43}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:23px}.wide{grid-column:auto}}</style>
</head><body><header><a href="catalog.html">← Pep Shop Texas Catalog</a></header><main><div class="card"><h1>Bulk Research Request</h1><p>Tell us what research materials you need. Our team will review your request and contact you about availability and a quote. <strong>This is not an order, and no payment is collected.</strong></p>
<form id="bulkForm"><div class="grid"><div class="field"><label for="customerName">Name *</label><input id="customerName" name="name" autocomplete="name" maxlength="120" required></div>
<div class="field"><label for="company">Company / Organization</label><input id="company" name="company" maxlength="160"></div>
<div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="50"></div>
<div class="field"><label for="product">Product *</label><input id="product" name="product" placeholder="Research product name" maxlength="160" required></div>
<div class="field"><label for="strength">Strength *</label><input id="strength" name="strength" placeholder="e.g. 10 mg" maxlength="100" required></div>
<div class="field"><label for="kits">Number of kits *</label><input id="kits" name="kits" type="number" min="1" max="500" value="1" required><span class="hint">1 kit = 10 vials</span></div>
<div class="field"><label for="testing">Testing preference *</label><select id="testing" name="testing" required><option value="pst_coordinated">Pep Shop Texas coordinates independent testing</option><option value="customer_coordinated">I coordinate independent testing</option></select></div>
<div class="field wide"><label for="requirements">Special requirements / notes</label><textarea id="requirements" name="requirements" maxlength="2000" placeholder="Tell us about your request"></textarea></div>
<div class="wide check"><input id="ack" type="checkbox" required><label for="ack">I understand the products are for legitimate laboratory research only, not human or veterinary use, and that submitting this request does not place an order or guarantee availability. *</label></div>
<div class="wide"><button id="submitBtn" type="submit">Submit Bulk Request</button><div class="notice" id="result" role="status" aria-live="polite"></div></div></div></form></div></main>
<script>
document.getElementById("bulkForm").addEventListener("submit",async e=>{
e.preventDefault();const form=e.currentTarget,button=document.getElementById("submitBtn"),result=document.getElementById("result");button.disabled=true;result.textContent="Submitting your request…";
try{const db=window.supabase.createClient("https://ucejjztsbmrogiteivxl.supabase.co","sb_publishable_ZZweuz4h3PMhOGrs0hBpiA_jruqk4dX");const v=n=>form.elements.namedItem(n).value;
const {data,error}=await db.rpc("pst_submit_bulk_request",{p_name:v("name"),p_company:v("company"),p_email:v("email"),p_phone:v("phone"),p_product:v("product"),p_strength:v("strength"),p_kits:Number(v("kits")),p_requirements:v("requirements"),p_testing_path:v("testing"),p_acknowledgment:document.getElementById("ack").checked});if(error)throw error;
form.innerHTML='<h2>Request submitted</h2><p>Your reference number is <strong>PST-B'+String(data).padStart(6,"0")+'</strong>.</p><p>We will review your bulk request and contact you using the email address provided. No order or payment has been created.</p><a href="catalog.html">Return to Catalog</a>';
}catch(error){result.textContent=error.message||"We could not submit your request.";button.disabled=false;}
});
</script></body></html>
