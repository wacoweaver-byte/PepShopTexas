<body data-page="register">
<main id="main">
<section class="wrap pad"><div class="authcard wide">
<span class="kick">New here</span><h1 class="serif">Create your account</h1><p class="muted">Takes a minute. Your orders, rewards and reorder reminders live here.</p>
<form class="form" data-form="register"><div class="g2"><label>First name<input name="first_name" required autocomplete="given-name"></label><label>Last name<input name="last_name" required autocomplete="family-name"></label></div>
<div class="g2"><label>Email<input name="email" type="email" required autocomplete="email" inputmode="email"></label><label>Mobile<input name="phone" type="tel" autocomplete="tel" inputmode="tel"></label></div>
<div><label class="pw">Password<input id="rpw" name="password" type="password" minlength="8" required autocomplete="new-password"><button type="button" data-pw="rpw" aria-label="Show password">Show</button></label></div>
<label>Research role<select name="research_role" required><option value="">Select one</option><option>Independent Researcher</option><option>Laboratory / Research Facility</option><option>Healthcare / Medical Office</option><option>Compounding / Formulation Business</option><option>Academic / University Research</option><option>Biotech / Pharmaceutical Research</option><option>Other Research-Related Use</option></select></label>
<fieldset><legend>Shipping address</legend><label>Street<input name="shipping_address" autocomplete="shipping street-address"></label><div class="g3"><label>City<input name="shipping_city" autocomplete="shipping address-level2"></label><label>State<input name="shipping_state" autocomplete="shipping address-level1"></label><label>ZIP<input name="shipping_zip" inputmode="numeric" autocomplete="shipping postal-code"></label></div>
<p class="muted small" style="margin:0">Picking up locally? You can leave this blank and add it later.</p></fieldset>
<fieldset><legend>Billing address</legend><label class="chk"><input type="checkbox" name="same_as_shipping" checked> Same as shipping</label><div data-bill><label>Street<input name="billing_address" autocomplete="billing street-address"></label><div class="g3"><label>City<input name="billing_city"></label><label>State<input name="billing_state"></label><label>ZIP<input name="billing_zip" inputmode="numeric"></label></div></div></fieldset>
<label class="chk"><input type="checkbox" name="age" required> I confirm I am at least 18 years old.</label>
<label class="chk"><input type="checkbox" name="research" required> This account and any purchases are for research purposes only.</label>
<label class="chk"><input type="checkbox" name="tos" required> I agree to the <a class="linkish" href="terms.html" target="_blank">Terms of Use</a>.</label>
<label class="chk"><input type="checkbox" name="marketing_opt_in"> Email me restocks, promotions and updates. Unsubscribe any time.</label>
<button class="btn primary wide" type="submit">Create account</button><p class="notice" data-msg hidden role="status"></p></form>
<div class="alt"><span class="muted">Already have an account?</span><a href="login.html">Sign in</a></div>
</div></section>
</main>
