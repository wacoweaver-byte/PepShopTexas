name: One-time wire Reports admin CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-wire-reports-admin-css.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared admin stylesheet to Reports only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('reports.html')
          text = path.read_text()
          link = '<link rel="stylesheet" href="css/admin.css?v=8">'
          if link not in text:
              marker = '</head>'
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'Expected exactly one </head>; found {count}')
              text = text.replace(marker, link + '\n' + marker, 1)
              path.write_text(text)
          PY
      - name: Remove temporary workflow and commit exact change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-wire-reports-admin-css.yml
          git add reports.html
          git commit -m "Wire Reports into shared admin stylesheet"
          git push
