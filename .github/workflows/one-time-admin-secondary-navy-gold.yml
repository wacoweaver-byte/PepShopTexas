name: One-time shared admin secondary action styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-admin-secondary-navy-gold.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make shared secondary admin actions navy with gold hover
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('css/admin.css')
          text = path.read_text()

          old = '.btn.secondary,a.btn.secondary,button.btn.secondary{color:var(--pst-admin-navy)!important;background:#fff!important;border-color:var(--pst-admin-navy)!important}'
          new = '.btn.secondary,a.btn.secondary,button.btn.secondary{color:#fff!important;background:var(--pst-admin-navy)!important;border-color:var(--pst-admin-navy)!important}'

          if old not in text:
              raise SystemExit('Expected shared secondary-button rule not found')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-admin-secondary-navy-gold.yml
          git add css/admin.css
          git commit -m "Apply navy gold actions across admin"
          git push
