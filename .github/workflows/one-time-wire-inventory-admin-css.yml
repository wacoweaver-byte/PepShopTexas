name: One-time wire inventory admin CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-wire-inventory-admin-css.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared admin stylesheet to inventory only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('inventory.html')
          text = path.read_text()
          link = '<link rel="stylesheet" href="css/admin.css?v=8">'
          if link not in text:
              if '</head>' not in text:
                  raise SystemExit('inventory.html has no </head>')
              text = text.replace('</head>', f'{link}\n</head>', 1)
              path.write_text(text)
          PY
      - name: Remove temporary workflow and commit exact change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-wire-inventory-admin-css.yml
          git add inventory.html
          git commit -m "Wire Inventory into shared admin stylesheet" || true
          git push
