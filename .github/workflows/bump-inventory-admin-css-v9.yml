name: Bump Inventory Admin CSS to v9
on:
  push:
    paths:
      - '.github/workflows/bump-inventory-admin-css-v9.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Inventory admin CSS cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('inventory.html')
          s = p.read_text()
          old = 'css/admin.css?v=8'
          new = 'css/admin.css?v=9'
          if old not in s:
              raise SystemExit('Expected admin.css?v=8 reference not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit Inventory only and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory.html
          git commit -m 'Bump Inventory admin CSS cache to v9'
          git rm .github/workflows/bump-inventory-admin-css-v9.yml
          git commit -m 'Remove one-time Inventory cache workflow'
          git push
