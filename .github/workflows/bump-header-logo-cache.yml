name: Bump header logo cache

on:
  push:
    paths:
      - '.logo-cache-bump'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump only non-index customer header logo references
        run: |
          for f in *.html; do
            [ "$f" = "index.html" ] && continue
            sed -i 's/pst-header-logo\.webp?v=3/pst-header-logo.webp?v=4/g' "$f"
          done
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh exact PST header logo on customer pages'
          git push
