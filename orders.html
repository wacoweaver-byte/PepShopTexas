<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pep Shop Texas | Orders Management</title>
</head>
<body>
  <noscript>JavaScript is required to load the Orders admin page.</noscript>
  <script>
    (async function(){
      try{
        const response = await fetch('admin.html', {cache:'no-store'});
        if(!response.ok) throw new Error('Could not load admin.html');
        let html = await response.text();

        const headClose = html.toLowerCase().lastIndexOf('</head>');
        if(headClose === -1) throw new Error('admin.html is missing </head>');
        html = html.slice(0, headClose) + '<link rel="stylesheet" href="css/admin.css?v=4">' + html.slice(headClose);

        html = html.replace(/<body([^>]*)>/i, '<body$1 data-admin-page="orders">');

        const bodyClose = html.toLowerCase().lastIndexOf('</body>');
        if(bodyClose === -1) throw new Error('admin.html is missing </body>');
        html = html.slice(0, bodyClose) + '<script src="admin-footer.js?v=4"><\/script>' + html.slice(bodyClose);

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML = '<main style="font-family:Arial,Helvetica,sans-serif;padding:32px"><h1>Orders</h1><p>Unable to load the admin orders page.</p></main>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
