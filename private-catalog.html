<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Price Catalog | Pep Shop Texas</title><style>body{margin:0;background:#f5f7fa;color:#172c40;font:16px system-ui,Arial}header{background:#102b45;color:white;padding:30px max(20px,calc((100vw - 960px)/2))}h1{margin:0;font-size:30px}main{max-width:960px;margin:30px auto;padding:0 20px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bac8d5;border-radius:8px;font-size:16px}table{width:100%;border-collapse:collapse;background:white;margin-top:20px}th,td{padding:13px;text-align:left;border-bottom:1px solid #e3e9ee}th{background:#e8eff5}td:last-child,th:last-child{text-align:right}#status{margin-top:15px;color:#52677a}.wrap{overflow-x:auto;border-radius:10px;box-shadow:0 3px 16px #132c4512}footer{padding:30px;text-align:center;color:#5d6e7e;font-size:13px}</style></head><body><header><h1>Pep Shop Texas</h1><p>Product Price Catalog</p></header><main><label for="search">Search catalog</label><input id="search" placeholder="Search by product name or strength" autocomplete="off"><p id="status" role="status">Loading catalog…</p><div class="wrap"><table><thead><tr><th>Product</th><th>Strength</th><th>Price</th></tr></thead><tbody id="items"></tbody></table></div></main><footer>Prices subject to change. For research purposes only.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://ucejjztsbmrogiteivxl.supabase.co","sb_publishable_ZZweuz4h3PMhOGrs0hBpiA_jruqk4dX");const body=document.getElementById("items"),status=document.getElementById("status"),search=document.getElementById("search");let records=[];function render(){const q=search.value.trim().toLowerCase();const rows=records.filter(r=>(r.display_name+" "+(r.strength||"")).toLowerCase().includes(q));body.replaceChildren();for(const r of rows){const tr=document.createElement("tr");for(const v of [r.display_name,r.strength||"—",Number(r.price).toLocaleString("en-US",{style:"currency",currency:"USD"})]){const td=document.createElement("td");td.textContent=v;tr.append(td)}body.append(tr)}status.textContent=rows.length+" product option"+(rows.length===1?"":"s")+(q?" matching search":"");if(!rows.length)status.textContent=q?"No matching products.":"No products currently listed."}search.addEventListener("input",render);(async()=>{try{const {data,error}=await db.from("catalog_listing").select("display_name,strength,price").order("display_name",{ascending:true});if(error)throw error;records=(data||[]).sort((a,b)=>a.display_name.localeCompare(b.display_name,undefined,{sensitivity:"base"})||(a.strength||"").localeCompare(b.strength||"",undefined,{numeric:true}));render()}catch(e){status.textContent="Catalog unavailable: "+e.message}})();</script></body></html>
