<!doctype html><html lang="en" data-auth-guard="admin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COA Manager | Pep Shop Texas</title><style id="pst-auth-guard-style">html{visibility:visible}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="auth-guard.js?v=1"></script><style>
*{box-sizing:border-box}body{font:15px "Segoe UI",Arial,sans-serif;background:#f5f7fa;color:#102a43;margin:0}header{background:#102a43;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}header a{color:white}main{max-width:1050px;margin:35px auto;padding:0 20px}h1{font-size:32px}section{background:white;border:1px solid #dce2e8;padding:25px;margin:22px 0}form{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #bac5cf;border-radius:3px}button,.btn{background:#102a43;color:white;border:0;padding:12px 20px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700}button:disabled{opacity:.5}.wide{grid-column:1/-1}.item{padding:18px 0;border-bottom:1px solid #e3e7eb;display:flex;align-items:center;justify-content:space-between;gap:12px}.item a{color:#102a43}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#657484}#status{min-height:24px} @media(max-width:650px){form{grid-template-columns:1fr}.item{display:block}}
</style></head><body><header><strong>PEP SHOP TEXAS · COA MANAGER</strong><a href="admin.html">← ADMIN DASHBOARD</a></header><main><h1>Certificate Management</h1><p class="muted">Upload a certificate, assign a product, strength, and unique lot number. Published certificates appear on the customer verification page.</p><section><h2>Add a COA</h2><form id="form"><div><label for="name">Peptide name</label><input id="name" required placeholder="Retatrutide"></div><div><label for="strength">Strength</label><input id="strength" required placeholder="60 mg"></div><div><label for="lot">Lot number</label><input id="lot" required placeholder="JPS20260905"></div><div class="wide"><label for="pdf">Certificate PDF (10 MB maximum)</label><input id="pdf" type="file" accept="application/pdf,.pdf" required></div><div class="wide"><button id="save">UPLOAD &amp; PUBLISH COA</button></div></form><p id="status" role="status"></p></section><section><h2>Published Certificates</h2><div id="list">Loading...</div></section><p><a href="coa.html">Open customer COA search ↗</a></p></main>
<script>
const SUPABASE_ENDPOINT="https://ucejjztsbmrogiteivxl.supabase.co",KEY="sb_publishable_ZZweuz4h3PMhOGrs0hBpiA_jruqk4dX";
const db=supabase.createClient(SUPABASE_ENDPOINT,KEY);const by=id=>document.getElementById(id);
async function ensureAdmin(){const {data,error:authError}=await Promise.race([db.auth.getUser(),new Promise((_,reject)=>setTimeout(()=>reject(Error("Login check timed out. Refresh or sign in again.")),12000))]);if(authError)throw authError;const user=data?.user;if(!user)throw Error("Sign in first");const result=await Promise.race([db.from("admin_users").select("user_id").eq("user_id",user.id).eq("is_active",true).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(Error("Admin access check timed out.")),12000))]);if(result.error)throw result.error;if(!result.data)throw Error("Admin access not confirmed for "+user.email);return user}
function link(lot,name,strength){const url=new URL("coa.html",location.href);url.searchParams.set("lot",lot);url.searchParams.set("peptide",name);url.searchParams.set("strength",strength);return url.href}
async function load(){const box=by("list");try{await ensureAdmin();const {data,error}=await Promise.race([db.from("coa_records").select("*").order("peptide_name",{ascending:true}).order("strength",{ascending:true}).order("lot_number",{ascending:true}),new Promise((_,reject)=>setTimeout(()=>reject(Error("Certificate list timed out.")),12000))]);if(error)throw error;box.replaceChildren();if(!data.length){box.textContent="No certificates uploaded yet.";return}for(const r of data){const div=document.createElement("div");div.className="item";const info=document.createElement("div");const strong=document.createElement("strong");strong.textContent=r.peptide_name+" · "+r.strength;const p=document.createElement("p");p.className="muted";p.textContent="Lot: "+r.lot_number;info.append(strong,p);const actions=document.createElement("div");actions.className="actions";const view=document.createElement("a");view.href=db.storage.from("coa-pdfs").getPublicUrl(r.storage_path).data.publicUrl;view.target="_blank";view.rel="noopener";view.textContent="View PDF";const copy=document.createElement("button");copy.textContent="Copy QR URL";copy.onclick=async()=>{await navigator.clipboard.writeText(link(r.lot_number,r.peptide_name,r.strength));by("status").textContent="QR link copied for "+r.lot_number};const remove=document.createElement("button");remove.textContent="Remove";remove.onclick=async()=>{if(!confirm("Remove COA record for "+r.lot_number+"?"))return;const {error}=await db.from("coa_records").delete().eq("id",r.id);if(error){by("status").textContent=error.message;return}await db.storage.from("coa-pdfs").remove([r.storage_path]);load()};actions.append(view,copy,remove);div.append(info,actions);box.append(div)}}catch(e){box.textContent="Unable to load COAs: "+e.message}}
setTimeout(()=>{if(by("list").textContent==="Loading...")by("list").textContent="Still loading: authentication or database request is taking too long. Try refreshing.";},14000);
by("form").onsubmit=async e=>{e.preventDefault();const btn=by("save");btn.disabled=true;by("status").textContent="Checking access and uploading certificate...";try{await ensureAdmin();const f=by("pdf").files[0];if(!f||f.type!=="application/pdf"||f.size>10485760)throw Error("Select a PDF under 10 MB");const lot=by("lot").value.trim(),name=by("name").value.trim(),strength=by("strength").value.trim();const path=crypto.randomUUID()+".pdf";let {error}=await db.storage.from("coa-pdfs").upload(path,f,{contentType:"application/pdf",upsert:false});if(error)throw error;const result=await db.from("coa_records").insert({peptide_name:name,strength,lot_number:lot,storage_path:path,is_published:true});if(result.error){await db.storage.from("coa-pdfs").remove([path]);throw result.error}by("status").textContent="Published "+lot+". QR URL: "+link(lot,name,strength);by("form").reset();await load()}catch(err){by("status").textContent="Upload failed: "+err.message}finally{btn.disabled=false}};load();
</script></body></html>
