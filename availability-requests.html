<!doctype html><html lang="en" data-auth-guard="admin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Availability Requests | Pep Shop Texas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="auth-guard.js?v=1"></script><style>body{font:15px Arial,sans-serif;background:#f4f7fa;color:#102a43;margin:0}header{background:#101820;padding:20px;color:white}header a{color:white;margin-right:24px}main{max-width:1400px;margin:32px auto;padding:0 20px}h1{margin-bottom:8px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:14px;text-align:left;border-bottom:1px solid #dce3ea}th{background:#e7eef5}select,button{padding:8px}section{overflow-x:auto;border-radius:12px;border:1px solid #dce3ea}#message{margin-bottom:15px}</style></head><body><header><a href="admin.html">← Orders</a><a href="inventory.html">Inventory</a><a href="products.html">Products</a></header><main><h1>Availability Requests</h1><p>Customer inquiries only. No inventory is reserved and no order or payment is created.</p><p id="message">Loading…</p><section><table><thead><tr><th>Requested</th><th>Product</th><th>Quantity</th><th>Customer</th><th>Email</th><th>Restock Notification Opt-in</th><th>Request Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
const db=supabase.createClient("https://ucejjztsbmrogiteivxl.supabase.co","sb_publishable_ZZweuz4h3PMhOGrs0hBpiA_jruqk4dX");
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){
 const {data:{user}}=await db.auth.getUser();if(!user){location.href="login.html?redirect=availability-requests.html";return;}
 const {data,error}=await db.from("product_availability_requests").select("*").order("created_at",{ascending:false}).limit(1000);
 if(error){document.getElementById("message").textContent=error.message;return;}
 document.getElementById("message").textContent=data.length+" requests";
 document.getElementById("rows").innerHTML=data.map(r=>'<tr><td>'+esc(new Date(r.created_at).toLocaleString())+'</td><td>'+esc(r.product_name)+' · '+esc(r.product_strength)+'<div>'+esc(r.product_key)+'</div></td><td>'+r.requested_quantity+'</td><td>'+esc(r.customer_name)+'</td><td><a href="mailto:'+encodeURIComponent(r.customer_email)+'">'+esc(r.customer_email)+'</a></td><td>'+(r.notify_when_available?"Yes":"No")+'</td><td><select data-id="'+esc(r.id)+'">'+["pending","notified","closed"].map(s=>'<option value="'+s+'" '+(r.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select></td></tr>').join("")||'<tr><td colspan="7">No availability inquiries yet.</td></tr>';
 document.querySelectorAll("[data-id]").forEach(el=>el.onchange=async()=>{const {error}=await db.from("product_availability_requests").update({status:el.value}).eq("id",el.dataset.id);if(error)alert(error.message)});
}
load();
</script></body></html>
